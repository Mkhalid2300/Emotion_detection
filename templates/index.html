<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
</head>
<body>
    <h1>Emotion Detector</h1>
    <p>Enter a statement below to analyze its emotional content:</p>

    <input type="text" id="textToAnalyze" placeholder="Enter text here" size="50">
    <button onclick="RunSentimentAnalysis()">Detect Emotion</button>

    <p id="system_response"></p>

    <script>
        function RunSentimentAnalysis() {
            const textToAnalyze = document.getElementById("textToAnalyze").value;
            const xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function() {
                if (this.readyState === 4 && this.status === 200) {
                    document.getElementById("system_response").innerHTML = this.responseText;
                }
            };
            xhttp.open("GET", "/emotionDetector?textToAnalyze=" + encodeURIComponent(textToAnalyze), true);
            xhttp.send();
        }
    </script>
</body>
</html>
